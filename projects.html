<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects — Construction Bobby</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Sample construction projects gallery — responsive images and accessible lightbox demo.">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Projects</h1>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="gallery" class="gallery" aria-label="Project gallery">
      <h2>Featured Projects</h2>
      <div class="grid">
        <!-- Gallery items inserted here -->

        <article class="card">
          <a href="#" class="gallery-link" data-project="ashoka">
            <picture>
              <source type="image/webp" srcset="/assets/projects/ashoka-320.webp 320w, /assets/projects/ashoka-640.webp 640w, /assets/projects/ashoka-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/ashoka-640.jpg" alt="Ashoka Business Park exterior — mixed-use office park, Jaipur">
            </picture>
            <h3>Ashoka Business Park</h3>
          </a>
        </article>

        <article class="card">
          <a href="#" class="gallery-link" data-project="meridian">
            <picture>
              <source type="image/webp" srcset="/assets/projects/meridian-320.webp 320w, /assets/projects/meridian-640.webp 640w, /assets/projects/meridian-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/meridian-640.jpg" alt="Meridian Row Homes — 18-unit residential row, Vaishali Nagar, Jaipur">
            </picture>
            <h3>Meridian Row Homes</h3>
          </a>
        </article>

        <article class="card">
          <a href="#" class="gallery-link" data-project="northgate">
            <picture>
              <source type="image/webp" srcset="/assets/projects/northgate-320.webp 320w, /assets/projects/northgate-640.webp 640w, /assets/projects/northgate-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/northgate-640.jpg" alt="Northgate Logistics Hub — 68,000 sq ft distribution facility">
            </picture>
            <h3>Northgate Logistics Hub</h3>
          </a>
        </article>

        <article class="card">
          <a href="#" class="gallery-link" data-project="copperline">
            <picture>
              <source type="image/webp" srcset="/assets/projects/copperline-320.webp 320w, /assets/projects/copperline-640.webp 640w, /assets/projects/copperline-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/copperline-640.jpg" alt="Copperline Studios — creative office design-build interior">
            </picture>
            <h3>Copperline Studios</h3>
          </a>
        </article>

        <article class="card">
          <a href="#" class="gallery-link" data-project="kothi">
            <picture>
              <source type="image/webp" srcset="/assets/projects/kothi-320.webp 320w, /assets/projects/kothi-640.webp 640w, /assets/projects/kothi-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/kothi-640.jpg" alt="Kothi No.14 — single-family custom home exterior, Malviya Nagar">
            </picture>
            <h3>Kothi No.14</h3>
          </a>
        </article>

        <article class="card">
          <a href="#" class="gallery-link" data-project="heritage">
            <picture>
              <source type="image/webp" srcset="/assets/projects/heritage-320.webp 320w, /assets/projects/heritage-640.webp 640w, /assets/projects/heritage-1200.webp 1200w" sizes="(max-width:600px) 320px, (max-width:900px) 640px, 1200px">
              <img loading="lazy" src="/assets/projects/heritage-640.jpg" alt="Heritage facade restoration — historic building frontage, Jaipur">
            </picture>
            <h3>Heritage Facade Restoration</h3>
          </a>
        </article>

      </div>
    </section>
  </main>

  <!-- Lightbox modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Project image viewer">
    <button class="lightbox-close" aria-label="Close">×</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <script src="/script.js" defer></script>
</body>
</html>
