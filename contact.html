<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Construction Bobby</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Contact</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section aria-labelledby="contact-title">
      <h2 id="contact-title">Get in touch</h2>
      <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" aria-live="polite">
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
        <div id="form-status" role="status" aria-live="polite"></div>
      </form>

      <p class="note">Form is wired to Formspree with a placeholder ID. Replace YOUR_FORM_ID with your Formspree form ID before using the form.</p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
